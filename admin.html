<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم الإدارة | سمكو SMAKO</title>
  <!-- Google Font Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: #f1f5f9;">

  <!-- Admin Login Modal -->
  <div class="modal-overlay" id="admin-login-modal">
    <div class="modal-box">
      <div style="width: 70px; height: 70px; background: var(--primary-light); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 15px;">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 style="font-size: 1.5rem; color: var(--primary); font-weight: 900; margin-bottom: 8px;">لوحة تحكم سمكو</h2>
      <p style="color: var(--gray); font-size: 0.95rem; margin-bottom: 25px;">يرجى إدخال كلمة مرور الإدارة للمتابعة</p>
      
      <form id="admin-login-form">
        <div class="form-group" style="text-align: right;">
          <label for="admin-password-input"><i class="fa-solid fa-key"></i> كلمة المرور</label>
          <input type="password" id="admin-password-input" class="form-control" placeholder="أدخل كلمة المرور (الافتراضية: smako2024)" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>تسجيل الدخول</span>
        </button>
      </form>
      <div style="margin-top: 20px;">
        <a href="index.html" style="color: var(--gray); font-size: 0.9rem;"><i class="fa-solid fa-arrow-right"></i> العودة للموقع الرئيسي</a>
      </div>
    </div>
  </div>

  <!-- Admin Main Dashboard Content -->
  <div id="admin-main-content" style="display: none;">
    
    <!-- Top Admin Header -->
    <header class="navbar" style="border-bottom: 1px solid #e2e8f0;">
      <div class="container">
        <div style="display: flex; align-items: center; gap: 15px;">
          <div class="logo-icon" style="width: 42px; height: 42px; font-size: 1.2rem;">
            <i class="fa-solid fa-shield-halved"></i>
          </div>
          <div>
            <h1 style="font-size: 1.3rem; font-weight: 900; color: var(--primary); line-height: 1;">لوحة إدارة سمكو</h1>
            <span style="font-size: 0.75rem; color: var(--gray);">SMAKO Control Panel</span>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 12px;">
          <a href="index.html" class="btn btn-outline btn-sm" target="_blank">
            <i class="fa-solid fa-globe"></i>
            <span>زيارة الموقع</span>
          </a>
          <button type="button" id="admin-logout-btn" class="btn btn-accent btn-sm">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span>تسجيل خروج</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main class="admin-page">
      <div class="container">
        
        <!-- Stats Row -->
        <div class="admin-stats-grid">
          <div class="stat-box">
            <div class="stat-box-icon stat-blue">
              <i class="fa-solid fa-fish"></i>
            </div>
            <div>
              <div class="stat-box-num" id="stat-total-products">0</div>
              <div class="stat-box-label">إجمالي المنتجات</div>
            </div>
          </div>

          <div class="stat-box">
            <div class="stat-box-icon stat-red">
              <i class="fa-solid fa-tags"></i>
            </div>
            <div>
              <div class="stat-box-num" id="stat-discount-products">0</div>
              <div class="stat-box-label">منتجات عليها خصومات</div>
            </div>
          </div>

          <div class="stat-box">
            <div class="stat-box-icon stat-gold">
              <i class="fa-solid fa-star"></i>
            </div>
            <div>
              <div class="stat-box-num" id="stat-featured-products">0</div>
              <div class="stat-box-label">منتجات مميزة في الواجهة</div>
            </div>
          </div>
        </div>

        <!-- Management Grid -->
        <div class="admin-grid">
          
          <!-- Product Add / Edit Form -->
          <div class="admin-card">
            <h2 class="admin-card-title" id="form-card-title">
              <i class="fa-solid fa-plus-circle"></i> إضافة منتج جديد
            </h2>

            <form id="admin-product-form">
              <input type="hidden" id="product-edit-id" value="">

              <div class="form-group">
                <label for="product-name"><i class="fa-solid fa-font"></i> اسم المنتج البحري *</label>
                <input type="text" id="product-name" class="form-control" placeholder="مثال: جمبري بحري جامبو" required>
              </div>

              <div class="form-group">
                <label for="product-category"><i class="fa-solid fa-tags"></i> الفئة / القسم *</label>
                <select id="product-category" class="form-control" required>
                  <option value="fish">أسماك طازجة</option>
                  <option value="shrimp">جمبري وبحريات</option>
                  <option value="fillet">فيليهات ومخلية</option>
                  <option value="seafood">كابوريا وسبيط</option>
                </select>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="product-price"><i class="fa-solid fa-money-bill-wave"></i> السعر الحالي (ج.م) *</label>
                  <input type="number" id="product-price" class="form-control" placeholder="مثال: 320" min="1" step="any" required>
                </div>
                <div class="form-group">
                  <label for="product-unit"><i class="fa-solid fa-scale-balanced"></i> وحدة البيع</label>
                  <input type="text" id="product-unit" class="form-control" value="كيلو" placeholder="كيلو / قطعة / طبق">
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="product-old-price"><i class="fa-solid fa-tag"></i> السعر قبل الخصم</label>
                  <input type="number" id="product-old-price" class="form-control" placeholder="اختياري (مثال: 360)">
                </div>
                <div class="form-group">
                  <label for="product-discount"><i class="fa-solid fa-percent"></i> نسبة الخصم %</label>
                  <input type="number" id="product-discount" class="form-control" placeholder="0" min="0" max="99">
                </div>
              </div>

              <div class="form-group">
                <label><i class="fa-solid fa-image"></i> صورة المنتج</label>
                <div style="margin-bottom: 8px;">
                  <input type="text" id="product-image-url" class="form-control" placeholder="رابط صورة المنتج (URL) أو ارفع ملف من جهازك">
                </div>
                <div>
                  <label style="display: inline-flex; align-items: center; gap: 8px; font-size: 0.88rem; color: var(--primary); cursor: pointer;">
                    <i class="fa-solid fa-upload"></i> أو رفع صورة من الكمبيوتر / الموبايل:
                    <input type="file" id="product-image-file" accept="image/*" style="display: none;">
                  </label>
                </div>
                <img id="form-image-preview" src="" alt="معاينة الصورة" style="display: none; width: 100%; height: 140px; object-fit: cover; border-radius: var(--radius-md); margin-top: 10px; border: 1px solid #e2e8f0;">
              </div>

              <div class="form-group">
                <label for="product-description"><i class="fa-solid fa-align-right"></i> وصف المنتج والمواصفات</label>
                <textarea id="product-description" class="form-control" rows="3" placeholder="وصف تفصيلي عن طزاجة المنتج، طرق الطهي المناسبة ومصدره..."></textarea>
              </div>

              <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" id="product-featured" style="width: 18px; height: 18px; cursor: pointer;">
                <label for="product-featured" style="margin-bottom: 0; cursor: pointer;">
                  <strong>عرض هذا الصنف في قسم (أبرز المنتجات) بالصفحة الرئيسية</strong>
                </label>
              </div>

              <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" id="form-submit-btn" class="btn btn-primary" style="flex: 1;">
                  <i class="fa-solid fa-plus"></i> إضافة المنتج للمتجر
                </button>
                <button type="button" id="cancel-edit-btn" class="btn btn-outline" style="display: none;">
                  إلغاء
                </button>
              </div>
            </form>
          </div>

          <!-- Product Table List -->
          <div class="admin-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
              <h2 class="admin-card-title" style="margin-bottom: 0; border: none; padding: 0;">
                <i class="fa-solid fa-boxes-stacked"></i> قائمة المنتجات الحالية
              </h2>
              <button type="button" class="btn btn-outline btn-sm" onclick="resetAllDefaultProducts()" title="استعادة الأصناف الافتراضية الأولية">
                <i class="fa-solid fa-arrows-rotate"></i> استعادة البيانات الافتراضية
              </button>
            </div>

            <div class="admin-table-wrapper">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>الصورة</th>
                    <th>الاسم والقسم</th>
                    <th>السعر / الوحدة</th>
                    <th>الخصم</th>
                    <th>الوصف</th>
                    <th style="text-align: center;">إجراءات</th>
                  </tr>
                </thead>
                <tbody id="admin-products-table-body">
                  <!-- Rendered dynamically -->
                </tbody>
              </table>
            </div>
          </div>

        </div>

      </div>
    </main>

  </div>

  <!-- Scripts -->
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
